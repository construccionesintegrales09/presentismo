<!DOCTYPE html>
<html>
<head>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prueba de distancia</title>
</head>

<body>
  <h1>Registro de asistencia</h1>

<h2 id="obra">Detectando obra...</h2>
  <div id="googleLogin"></div>

  <br><br>

<label for="actividad">Actividad:</label>

<select id="actividad">
  <option value="">Cargando actividades...</option>
</select>
  <button onclick="verificarUbicacion()">Verificar ubicación</button>
<br><br>
<button onclick="enviarPrueba()">Enviar registro de prueba</button>
  <br><br>
<button onclick="registrarAsistencia()">Registrar asistencia</button>
  <p id="resultado"></p>

  <script>
const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbww6PYtAw0MHJeFHzL_OAN_Uy-dInzRPjIBsucpDT8O47WjI84MUlooBYmLmaLz2kILUw/exec";
    // Coordenadas de prueba de la "obra"

const parametros = new URLSearchParams(window.location.search);
const obra = parametros.get("obra");

if (obra) {

  document.getElementById("obra").innerHTML =
    "Cargando obra...";

  fetch(URL_APPS_SCRIPT + "?obra=" + encodeURIComponent(obra))
    .then(response => response.json())
    .then(datos => {

      if (!datos) {
        document.getElementById("obra").innerHTML =
          "❌ Obra no encontrada";
        return;
      }

      document.getElementById("obra").innerHTML =
        "Obra: " + datos.obra;

      obraLat = datos.latitud;
      obraLon = datos.longitud;
      radioPermitido = datos.radio;

    })
    .catch(error => {

      document.getElementById("obra").innerHTML =
        "❌ No se pudo consultar la obra";

      console.error(error);
    });

} else {

  document.getElementById("obra").innerHTML =
    "⚠️ No se indicó ninguna obra";
}
    
   let obraLat;
let obraLon;
let radioPermitido;
let empleadoEmail = "";
let empleadoNombre = "";

    function calcularDistancia(lat1, lon1, lat2, lon2) {

      const R = 6371000; // radio de la Tierra en metros

      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;

      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * Math.PI / 180) *
        Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);

      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

      return R * c;
    }


    function verificarUbicacion() {

      const resultado = document.getElementById("resultado");

      resultado.innerHTML = "Obteniendo ubicación...";

      if (!navigator.geolocation) {

        resultado.innerHTML =
          "Este teléfono no permite obtener ubicación.";

        return;
      }


      navigator.geolocation.getCurrentPosition(

        function(position) {

          const lat = position.coords.latitude;
          const lon = position.coords.longitude;
          const precision = position.coords.accuracy;

          const distancia = calcularDistancia(
            lat,
            lon,
            obraLat,
            obraLon
          );

          let mensaje =
            "Distancia a la obra: " +
            Math.round(distancia) +
            " metros<br><br>";

          mensaje +=
            "Precisión aproximada del GPS: " +
            Math.round(precision) +
            " metros<br><br>";


          if (distancia <= radioPermitido) {

            mensaje +=
              "✅ ESTÁS DENTRO DEL RADIO PERMITIDO";

          } else {

            mensaje +=
              "❌ ESTÁS FUERA DEL RADIO PERMITIDO";
          }


          resultado.innerHTML = mensaje;
        },


        function(error) {

          resultado.innerHTML =
            "No se pudo obtener la ubicación.<br>" +
            "Código de error: " +
            error.code;
        },


        {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 0
        }
      );
    }
    function enviarPrueba() {

  const datos = new URLSearchParams();

  datos.append("fecha", new Date().toLocaleDateString());
  datos.append("hora", new Date().toLocaleTimeString());
  datos.append("empleado", empleadoNombre);
  datos.append("obra", obra);
  datos.append("actividad", "Pintura");
  datos.append("latitud", obraLat);
  datos.append("longitud", obraLon);

  fetch(URL_APPS_SCRIPT, {
    method: "POST",
    mode: "no-cors",
    body: datos
  });

  alert("Registro enviado");
}

    window.onload = function () {
      cargarActividades();

  google.accounts.id.initialize({
    client_id: "306225002515-r0hrppto4pe6i17cfvtepabslclt65dm.apps.googleusercontent.com",
    callback: manejarLogin
  });

  google.accounts.id.renderButton(
    document.getElementById("googleLogin"),
    {
      theme: "outline",
      size: "large",
      text: "signin_with",
      shape: "rectangular"
    }
  );
};

function registrarAsistencia() {

  const actividad = document.getElementById("actividad").value;

  if (!empleadoEmail || !empleadoNombre) {

    document.getElementById("resultado").innerHTML =
      "❌ Primero tenés que acceder con Google.";

    return;
  }

  if (!actividad) {

    document.getElementById("resultado").innerHTML =
      "❌ Seleccioná una actividad.";

    return;
  }

  document.getElementById("resultado").innerHTML =
    "Obteniendo ubicación...";

}
function manejarLogin(response) {

  const datos = JSON.parse(
    atob(response.credential.split(".")[1])
  );

  const email = datos.email;
  empleadoEmail = email;

  document.getElementById("googleLogin").innerHTML =
    "Consultando usuario...";

  fetch(
    URL_APPS_SCRIPT +
    "?empleado=" +
    encodeURIComponent(email)
  )
    .then(response => response.json())
    .then(empleado => {

      if (!empleado || empleado.activo.toString().toUpperCase() !== "SI") {

        document.getElementById("googleLogin").innerHTML =
          "❌ Usuario no autorizado";

        return;
      }

      empleadoNombre = empleado.nombre;
      
      document.getElementById("googleLogin").innerHTML =
        "✅ Hola, " + empleado.nombre;

    })
    .catch(error => {

      document.getElementById("googleLogin").innerHTML =
        "❌ No se pudo verificar el usuario.";

      console.error(error);
    });
}

    function cargarActividades() {

  const selector = document.getElementById("actividad");

  fetch(URL_APPS_SCRIPT + "?actividades=1")
    .then(response => response.json())
    .then(actividades => {

      selector.innerHTML =
        '<option value="">Seleccionar actividad...</option>';

      actividades.forEach(function(actividad) {

        const opcion = document.createElement("option");

        opcion.value = actividad;
        opcion.textContent = actividad;

        selector.appendChild(opcion);
      });

    })
    .catch(error => {

      selector.innerHTML =
        '<option value="">Error al cargar actividades</option>';

      console.error(error);
    });
}
  </script>

</body>
</html>
